    <title>Configuration</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: 
                radial-gradient(circle at center, rgba(250, 101, 37, 1), transparent), /* Radial gradient at the center */
                linear-gradient(to left, rgba(35, 35, 35, 1), transparent), /* Linear gradient to the left */
                linear-gradient(to right, rgba(35, 35, 35, 1), transparent); /* Linear gradient to the right */
            background-blend-mode: multiply; /* Blend mode for background layers */
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: fit-content;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            width: 300px; /* Set fixed width */
            height: fit-content; /* Set dynamic height */
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .form {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            font-size: 18px;
            margin-bottom: 10px;
            display: block;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: #ff7300;
            color: #fff;
            padding: 5px 5px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.5s ease;
            width: 300px;
            text-align: center;
            margin: 2px;
        }

        button:hover {
            background-color: #ff8826;
        }
    </style>
</head>

    <div class="container">
        <h1>Micro-ROS Configuration</h1>
        <form class="form" id="ROSForm" action="/set-ros" method="get">
            <label for="AgentIP">Agent IP:</label>
            <input type="text" id="AgentIP" name="AgentIP" minlength="7" maxlength="15" size="15" pattern="^(?>(\d|[1-9]\d{2}|1\d\d|2[0-4]\d|25[0-5])\.){3}(?1)$" placeholder="Agent IP" value="<AGENTIP>" required>

            <label for="AgentPort">Agent Port:</label>
            <input type="number" id="AgentPort" name="AgentPort" min="0" max="65535" step="1" placeholder="Agent Port" value="<AGENTPORT>" required>

            <label for="DomainID">DomainID:</label>
            <input type="number" id="DomainID" name="DomainID" min="0" max="231" step="1" placeholder="Domain ID" value="<DOMAINID>" required>

            <button id="ROSsaveBtn" type="submit">Save ROS Configuration</button>
        </form>
    </div>
